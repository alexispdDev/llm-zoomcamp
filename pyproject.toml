[project]
name = "llm-zoomcamp"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "alexispd", email = "alexispd@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "gitsource==0.0.5",
    "minsearch==0.1.0",
    "onnxruntime==1.27.0",
    "openai==2.41.1",
    "pandas==3.0.3",
    "psycopg[binary]>=3.3.4",
    "python-dotenv==1.2.2",
    "requests==2.34.2",
    "sentence-transformers==5.6.0",
    "sqlitesearch==0.1.1",
    "tokenizers>=0.22.2",
    "toyaikit==0.0.11",
    "tqdm==4.68.4",
]

[project.scripts]
llm-zoomcamp = "llm_zoomcamp:main"

[build-system]
requires = ["uv_build>=0.9.5,<0.10.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "huggingface-hub>=1.21.0",
    "ipykernel==7.3.0",
]
